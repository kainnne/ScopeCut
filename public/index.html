<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta name="googlebot" content="notranslate" />
  <title>ScopeCut</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="bg-blobs">
  <header class="site-header">
    <div class="wrap">
      <h1>ScopeCut</h1>
      <p class="tagline">Design by Kainnne</p>
    </div>
  </header>

  <main class="wrap">
    <!-- 登入：帳密 → 驗證碼 -->
    <section id="login-view" class="glass-card login-card hidden">
      <div id="step-credentials">
        <h2>登入</h2>
        <form id="login-form">
          <label>
            帳號
            <input type="text" id="login-user" autocomplete="username" required />
          </label>
          <label>
            密碼
            <input type="password" id="login-pass" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="error hidden"></p>
          <button type="submit" class="btn-primary" id="login-btn">登入並寄送驗證碼</button>
        </form>
      </div>

      <div id="step-verify" class="hidden">
        <h2>輸入驗證碼</h2>
        <p id="verify-hint" class="muted"></p>
        <form id="verify-form">
          <label>
            六位數驗證碼
            <input type="text" id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required />
          </label>
          <p id="verify-error" class="error hidden"></p>
          <button type="submit" class="btn-primary" id="verify-btn">驗證並進入</button>
          <button type="button" class="btn-ghost" id="resend-btn">重新寄送</button>
          <button type="button" class="btn-ghost" id="back-credentials">返回</button>
        </form>
      </div>
    </section>

    <!-- 主畫面：分步精靈 -->
    <section id="app-view" class="hidden">
      <div class="wizard-top">
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-meta">
            <span id="progress-label">1 / 1</span>
            <button type="button" class="btn-ghost small" id="logout-btn">登出</button>
          </div>
          <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
      </div>

      <div id="wizard-panel" class="glass-card wizard-panel"></div>

      <div class="glass-card hidden" id="progress-card">
        <h3>執行中…</h3>
        <ul id="progress-list"></ul>
        <p class="muted" id="elapsed"></p>
        <p class="muted">Codex 深度規劃通常約 1–5 分鐘，請保持此頁面開啟。</p>
      </div>

      <div class="glass-card hidden result-ok" id="result-card">
        <h3>完成</h3>
        <dl id="result-detail"></dl>
        <button type="button" class="btn-ghost" id="again-btn">再做一次</button>
      </div>

      <div class="glass-card hidden result-err" id="error-card">
        <h3>失敗了</h3>
        <p id="error-message"></p>
        <button type="button" class="btn-ghost small" id="error-dismiss">關閉</button>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
