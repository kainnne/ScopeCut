<!doctype html>
<html lang="zh-Hant" data-mood="dream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="把模糊想法整理成可開始的第一版。" />
    <meta name="theme-color" content="#fff8fc" />
    <meta name="scopecut-api-base" content="https://scopecut-auth.chaos60649.workers.dev" />
    <meta property="og:title" content="ScopeCut" />
    <meta property="og:description" content="把模糊想法整理成可開始的第一版。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scopecut.kainnne.com/" />
    <link rel="canonical" href="https://scopecut.kainnne.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&amp;family=DM+Mono:wght@400;500&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <title>ScopeCut</title>
  </head>
  <body>
    <a class="skip-link" href="#builder">開始使用 ScopeCut</a>
    <div class="dream-background" aria-hidden="true">
      <i></i><i></i><i></i><span></span>
    </div>
    <div class="page-grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand-link" href="#top"><span>S</span>ScopeCut</a>
      <nav aria-label="網站選項">
        <button class="points-balance" type="button" data-open-pricing><i></i><b id="points-balance">2</b> 點</button>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換深色模式">◐</button>
        <a href="https://kainnne.com" target="_blank" rel="noreferrer">Kainnne ↗</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero section-shell">
        <div class="hero-copy">
          <h1>把想法，<br /><span>做成第一版。</span></h1>
          <p>回答幾個問題，取得方向、學習清單和 Agent Prompt。</p>
          <button class="primary-button" type="button" data-start>開始 <span>↘</span></button>
        </div>
        <div class="scope-visual" aria-hidden="true">
          <div class="scope-core"><span>Scope</span><strong>Cut</strong></div>
          <span class="scope-chip chip-one">方向</span>
          <span class="scope-chip chip-two">第一版</span>
          <span class="scope-chip chip-three">Prompt</span>
        </div>
      </section>

      <section class="builder-section section-shell" id="builder">
        <div class="builder-shell" id="builder-shell">
          <div class="builder-topbar">
            <span id="builder-step-label">1 / 5</span>
            <strong id="builder-step-name">你的想法</strong>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="builder-progress"></span></div>
          <div class="builder-content" id="builder-content"></div>
          <noscript>請啟用 JavaScript。</noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <span>ScopeCut</span>
      <nav><a href="https://kainnne.com" target="_blank" rel="noreferrer">Kainnne ↗</a><a href="https://github.com/kainnne/ScopeCut" target="_blank" rel="noreferrer">GitHub ↗</a></nav>
    </footer>

    <dialog class="modal" id="auth-dialog" aria-labelledby="auth-title">
      <button class="modal-close" type="button" data-close-dialog aria-label="關閉">×</button>
      <div id="auth-email-step">
        <h2 id="auth-title">輸入 Email</h2>
        <form id="auth-form">
          <div class="email-control"><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email" required /><button type="submit">繼續</button></div>
          <small>草稿已保存。</small>
        </form>
      </div>
      <div class="hidden" id="auth-code-step">
        <h2 id="auth-email-display"></h2>
        <form id="auth-code-form">
          <div class="email-control"><input id="auth-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="六位驗證碼" aria-label="六位驗證碼" required /><button type="submit">驗證</button></div>
          <small id="auth-status" role="status" aria-live="polite"></small>
        </form>
        <button class="text-button" id="back-to-email" type="button">更換 Email</button>
      </div>
    </dialog>

    <dialog class="modal payment-modal" id="payment-dialog" aria-labelledby="payment-title">
      <button class="modal-close" type="button" data-close-dialog aria-label="關閉">×</button>
      <h2 id="payment-title">點數尚未開放</h2>
      <div class="plan-list">
        <span><b>US$1</b>10 點</span>
        <span><b>US$3</b>40 點</span>
        <span><b>US$5</b>100 點</span>
      </div>
      <small>不會扣款</small>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
